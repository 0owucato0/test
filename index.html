<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>線上測驗</title>

<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Noto+Sans+TC:wght@400;700;900&family=Inter:wght@700;900&display=swap" rel="stylesheet">

<style>
    :root {
        --nintendo-red: #ff4b4b;
        --nintendo-blue: #00d2ff;
        --nintendo-yellow: #ffce00;
        --nintendo-green: #44bd32;
        --nintendo-dark: #2f3640;
        --border-thick: 5px solid var(--nintendo-dark);
        --font-main: 'Noto Sans TC', 'Inter', sans-serif;
        --font-display: 'ZCOOL KuaiLe', cursive;
    }

    body { 
        margin: 0; font-family: var(--font-main); background: #fdf6e3;
        background-image: radial-gradient(var(--nintendo-yellow) 2px, transparent 0);
        background-size: 30px 30px; color: var(--nintendo-dark);
        -webkit-user-select: none; user-select: none; overflow-x: hidden; line-height: 1.6;
    }

    .timer, button { font-family: var(--font-display); letter-spacing: 1px; }

    .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 0px 10px; box-sizing: border-box; }

    .quiz-container{
        width: 95%; max-width: 900px; background: #fff; border-radius: 30px; 
        border: var(--border-thick); padding: 15px 15px 15px 10px; box-shadow: 12px 12px 0px var(--nintendo-dark);
        position: relative; box-sizing: border-box; margin: 20px 20px 20px 10px;
        animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
	
	.result { 
        width: 95%; max-width: 900px; background: #fff; border-radius: 30px; 
        border: var(--border-thick); padding:10px 10px 30px 10px; box-shadow: 12px 12px 0px var(--nintendo-dark);
        position: relative; box-sizing: border-box; margin: 10px 20px 20px 10px;
        animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn { 0% { transform: scale(0.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    .quiz-container img.main-img { 
        display: block; margin: 0 auto; width: auto; max-width: 100%; 
        height: auto; max-height: 40vh; object-fit: contain; 
        border: var(--border-thick); border-radius: 20px; background: #fff;
    }

    .question { margin: 15px 0; font-size: clamp(1.1rem, 4vw, 1.5rem); font-weight: 900; text-align: center; }

    .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    /* 1. 移除手機預設點擊高亮顏色 */
.option { 
    padding: 14px 10px; 
    border-radius: 18px; 
    background: #fff; 
    cursor: pointer; 
    font-size: 1.05rem; 
    font-weight: 700; 
    border: var(--border-thick); 
    text-align: center; 
    box-shadow: 0 5px 0 var(--nintendo-dark); 
    transition: 0.2s; 
    
    /* 關鍵：禁用手機點擊時的預設陰影 */
    -webkit-tap-highlight-color: transparent; 
}

/* 2. 修正：只有在真正的滑鼠懸停時才變黃色，避免手機點擊變黃 */
@media (hover: hover) {
    .option:hover { 
        background: var(--nintendo-yellow); 
        transform: translateY(-3px); 
    }
}

/* 3. 選中狀態增加 !important 確保覆蓋所有背景設定 */
.option.selected { 
    background: var(--nintendo-blue) !important; 
    color: #fff !important; 
    transform: translateY(2px);
    box-shadow: 0 2px 0 var(--nintendo-dark);
}

    /* --- 控制列與進度條佈局 --- */
    .control { 
        display: flex; flex-wrap: wrap; gap: 12px; align-items: center; 
        justify-content: space-between; margin-top: 20px; 
    }

    /* 手機版：進度條排在最前面 (order: 1) */
    .progress-area {
        position: relative; height: 50px; 
 
        overflow: hidden; width: 100%; order: 1; 
    }

    .timer { 
        background: var(--nintendo-yellow); border: var(--border-thick); 
        padding: 5px 5px; border-radius: 50px; font-weight: 900; 
        font-size: 1.3rem; min-width: 45px; text-align: center;
        order: 2; /* 手機版排在中間 */
    }

    .btn-group { 
        display: flex; gap: 10px; order: 3; /* 手機版排在最後面 */
    }

    /* 電腦版響應式判斷 (寬度 > 600px) */
    @media (min-width: 600px) {
        .control { flex-wrap: nowrap; }
        .timer { order: 1; }         /* 電腦版：左側計時器 */
        .progress-area { 
            width: auto; 
            flex-grow: 1; 
            order: 2;                /* 電腦版：中間進度條 */
            margin-bottom: 0;
        }
        .btn-group { order: 3; }     /* 電腦版：右側按鈕組 */
		.page {justify-content: center;}
    }

    .pingu {
        position: absolute; width: 50px; height: 50px; top: 0px;
        object-fit: contain;
        animation: pinguWobble 0.7s infinite ease-in-out alternate;
    }

    #pingu2 { left: 5px; z-index: 2; } 
    #pingu1 { 
        z-index: 3; 
        transition: left 1s linear; 
    } 

    @keyframes pinguWobble {
        0% { transform: rotate(-5deg); }
        100% { transform: rotate(5deg); }
    }

    button { padding: 10px; border-radius: 15px; border: var(--border-thick); cursor: pointer; font-weight: 900; box-shadow: 4px 4px 0 var(--nintendo-dark); transition: 0.1s; font-size: 1rem; }
    button:active { transform: translate(2px, 2px); box-shadow: 0px 0px 0 var(--nintendo-dark); }
    .btn-red { background: var(--nintendo-red); color: #fff; }
    .btn-green { background: var(--nintendo-green); color: #fff; }
    .btn-yellow { font-family: var(--font-main); background: var(--nintendo-yellow); color: var(--nintendo-dark); min-width: 55px; }

    #resultGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; justify-content: center; justify-items: center; }
    @media (min-width: 650px) { #resultGrid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }
    .result-item { width: 100%; max-width: 200px; background: #fff; border: 3px solid var(--nintendo-dark); border-radius: 15px; padding: 8px; cursor: pointer; box-shadow: 4px 4px 0 var(--nintendo-dark); display: flex; flex-direction: column; box-sizing: border-box; }
    .thumb-container { width: 100%; aspect-ratio: 1 / 1; overflow: hidden; border-radius: 10px; border: 2px solid var(--nintendo-dark); margin-bottom: 5px; }
    .thumb-container img { width: 100%; height: 100%; object-fit: cover; }
    .result-info { font-size: 0.8rem; font-weight: 700; }
	.tag { display: inline-block; padding: 2px 6px; border-radius: 5px; color: #fff; font-size: 0.65rem; margin-bottom: 3px; }
    .tag-correct { background: var(--nintendo-green); }
    .tag-wrong { background: var(--nintendo-red); }
    #modalOverlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(47, 54, 64, 0.85); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(8px); padding: 20px; box-sizing: border-box; }
    .modal-content { background: #fff; border: var(--border-thick); border-radius: 25px; max-width: 500px; width: auto; padding: 20px; box-sizing: border-box; animation: modalShow 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .modal-content img { max-width: 100%; max-height: 40vh; border-radius: 15px; display: block; margin: 0 auto 10px; border: 2px solid #eee; }

	/* 更新按鈕 */
    .update-btn {
        position: fixed; bottom: 25px; left: 25px;
        background: #fff; border: var(--border-thick);
        padding: 12px 20px; border-radius: 50px; font-weight: 900;
        box-shadow: 5px 5px 0 var(--nintendo-dark);
		font-family: var(--font-main);
    }

	/* 隨機結果圖片樣式 */
.result-pingu {
    display: block;
    margin: 0 auto 15px; /* 居中並與下方 scoreText 保持間距 */
    max-width: 200px;
    width: 60%;         /* 手機版自適應寬度 */
    height: auto;
    animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
</style>
</style>
</head>

<body>

<div class="page" id="startPage">
    <div class="quiz-container" style="max-width: 400px; text-align: center;">
        <h1 style="font-size: 3rem; color: var(--nintendo-red); margin: 0 0 15px 0;text-shadow: 1px 1px 1px rgba(1,1,1,1);">設定</h1>
        <div style="background: #f0f0f0; padding: 20px; border-radius: 20px; margin-bottom: 20px; border: 3px dashed #bbb; font-weight: 700;">
            <p>⏰ 時間: <input id="timeInput" type="number" value="20" style="width:55px; text-align: center; font-weight: 900; border: 2px solid #333; border-radius: 5px;"></p>
            <p>📚 題數: <input id="questionCount" type="number" value="10" style="width:55px; text-align: center; font-weight: 900; border: 2px solid #333; border-radius: 5px;"></p>
        </div>
        <button class="btn-green" style="width:100%; font-size: 1.4rem;" onclick="startQuiz()">START!</button>
    </div>
	<button class="update-btn" id="updateBtn" onclick="forceUpdate()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg> 更新題庫</button>
</div>

<div class="page" id="quizPage" style="display:none;">
    <div class="quiz-container">
        <img id="questionImage" class="main-img" src="">
        <div class="question" id="questionText">載入中...</div>
        <div id="options" class="options"></div>
        
        <div class="control">
            <div class="progress-area">
                <img id="pingu2" class="pingu" src="./pingu2.png" alt="Goal">
                <img id="pingu1" class="pingu" src="./pingu1.png" alt="Runner">
            </div>

            <div class="timer" id="timer">20</div>

            <div class="btn-group">
                <button class="btn-yellow" id="pauseBtn" onclick="togglePause()">暫停</button>
                <button class="btn-red" onclick="nextQuestion()">NEXT ▶</button>
            </div>
        </div>
    </div>
</div>

<div class="page" id="resultPage" style="display:none;">
    <div class="result">
        <h2 style="text-align:center; font-size: 2.2rem; color: var(--nintendo-red);">測驗結果...</h2>
		<div id="resultPinguContainer"></div>
        <h3 id="scoreText" style="text-align: center; margin-bottom: 15px;"></h3>
        <div id="resultGrid"></div>
        <button class="btn-red" style="width:100%; margin-top:25px;" onclick="location.reload()">RETRY ↺</button>
    </div>
</div>

<div id="modalOverlay" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <img id="modalImg" src="">
        <h2 id="modalQ" style="text-align: center; font-size: 1.2rem; margin-bottom: 10px; font-weight: 900;"></h2>
        <p id="modalA" style="text-align: center; font-weight: 700;"></p>
        <button class="btn-green" style="width:100%; margin-top: 15px;" onclick="closeModal()">CLOSE</button>
    </div>
</div>

<script>
// JavaScript 邏輯部分保持不變
const SPREADSHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQo7GuN_TnyDh5x_8AQhVhoj6jzTjeCIgMGQSVAhXOG5fhsn7PuBzQDvIAB5fg8NP16DJcvtqp5PFqU/pub?output=csv';
const CACHE_KEY = 'quiz_data_cache';

let questions = []; let selected = []; let index = 0; let timeLimit = 20;
let timer = null; let userAnswers = []; let isPaused = false;

function parseCSV(csvText) {
    const lines = csvText.split(/\r?\n/);
    return lines.slice(1).map(line => {
        const cols = line.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
        return cols.length >= 3 ? { img: cols[0].replace(/"/g, '').trim(), q: cols[1].replace(/"/g, '').trim(), a: cols[2].replace(/"/g, '').trim() } : null;
    }).filter(x => x);
}

async function startQuiz() {
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
        questions = JSON.parse(cached);
    } else {
        const response = await fetch(SPREADSHEET_CSV_URL + '&t=' + Date.now());
        const csvData = await response.text();
        questions = parseCSV(csvData);
        localStorage.setItem(CACHE_KEY, JSON.stringify(questions));
    }
    
    timeLimit = parseInt(document.getElementById("timeInput").value) || 20;
    const count = parseInt(document.getElementById("questionCount").value) || 10;
    selected = [...questions].sort(() => 0.5 - Math.random()).slice(0, count);
    index = 0; userAnswers = [];
    document.getElementById("startPage").style.display = "none";
    document.getElementById("quizPage").style.display = "flex";
    showQuestion();
}

// 加入標準洗牌演算法，確保隨機性絕對公平且不會遺漏
function shuffle(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function showQuestion() {
    if (index >= selected.length) return showResult();
    clearInterval(timer);
    isPaused = false;
    
    const pingu1 = document.getElementById("pingu1");
    const pauseBtn = document.getElementById("pauseBtn");
    const timerEl = document.getElementById("timer");
    
    pauseBtn.textContent = "暫停";
    pingu1.src = "./pingu1.png"; 
    
    const q = selected[index];
    
    // 確保圖片網址去空白後比對更精準
    const currentImgTrimmed = q.img.trim();
    
    document.getElementById("questionImage").src = currentImgTrimmed;
    document.getElementById("questionText").textContent = q.q;
    const optionsEl = document.getElementById("options");
    optionsEl.innerHTML = "";

    // 1. 找出所有與當前題目「相同圖片」且「答案不等於正解」的選項
    let sameImgPool = questions
        .filter(x => x.img.trim() === currentImgTrimmed && x.a !== q.a)
        .map(x => x.a);
        
    // 2. 去除重複的答案
    let uniqueSameImgPool = [...new Set(sameImgPool)];

    // 3. 隨機打亂並抽取最多 3 個錯誤選項
    let wrongs = shuffle(uniqueSameImgPool).slice(0, 3);

    // 4. 【防呆】如果同圖的不重複選項真的不到 3 個，才從全域補齊
    if (wrongs.length < 3) {
        let globalPool = questions
            .filter(x => x.a !== q.a && !wrongs.includes(x.a))
            .map(x => x.a);
        let uniqueGlobalPool = [...new Set(globalPool)];
        
        let extraWrongs = shuffle(uniqueGlobalPool).slice(0, 3 - wrongs.length);
        wrongs = wrongs.concat(extraWrongs);
    }

    // 5. 合併正確答案並最終洗牌
    const finalChoices = shuffle([q.a, ...wrongs]);

    // 渲染選項
    finalChoices.forEach((ans) => {
        const div = document.createElement("div");
        div.className = "option";
        div.textContent = ans; 
        
        div.onclick = () => {
            document.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
            div.classList.add("selected");
            userAnswers[index] = ans; 
        };
        optionsEl.appendChild(div);
    });

    // --- 以下為計時器與動畫邏輯 (維持不變) ---
    let sec = timeLimit;
    const container = document.querySelector(".progress-area");
    
    pingu1.style.transition = "none";
    pingu1.style.left = (container.offsetWidth - 55) + "px";
    
    void pingu1.offsetWidth; 
    pingu1.style.transition = "left 1s linear";

    timerEl.textContent = sec;
    
    timer = setInterval(() => { 
        if (!isPaused) {
            sec--; 
            timerEl.textContent = sec; 
            
            const startX = container.offsetWidth - 55;
            const endX = 20; 
            let progress = Math.min((timeLimit - sec) / timeLimit, 1);
            let currentLeft = startX - (startX - endX) * progress;
            
            pingu1.style.left = currentLeft + "px";

            if(sec <= 0) nextQuestion(); 
        }
    }, 1000);
}

function togglePause() {
    isPaused = !isPaused;
    const pingu1 = document.getElementById("pingu1");
    const pauseBtn = document.getElementById("pauseBtn");
    
    pauseBtn.textContent = isPaused ? "繼續" : "暫停";
    
    if (isPaused) {
        pingu1.src = "./pingu1_stop.png"; 
        const currentLeft = window.getComputedStyle(pingu1).left;
        pingu1.style.transition = "none";
        pingu1.style.left = currentLeft;
    } else {
        pingu1.src = "./pingu1.png"; 
        pingu1.style.transition = "left 1s linear";
    }
}

function nextQuestion() {
    clearInterval(timer);
    if (!userAnswers[index]) userAnswers[index] = "未作答";
    index++; showQuestion();
}

function showResult() {
    document.getElementById("quizPage").style.display = "none";
    document.getElementById("resultPage").style.display = "flex";
    
    // --- 新增：隨機抽圖片邏輯 ---
    const pinguChars = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
    const randomChar = pinguChars[Math.floor(Math.random() * pinguChars.length)];
    const pinguContainer = document.getElementById("resultPinguContainer");
    
    // 生成圖片 HTML
    pinguContainer.innerHTML = `<img src="./pingu_${randomChar}.png" class="result-pingu" alt="Result Pingu">`;
	
    let correctCount = 0;
    const grid = document.getElementById("resultGrid");
    grid.innerHTML = "";

    selected.forEach((q, i) => {
        const isCorrect = userAnswers[i] === q.a;
        if (isCorrect) correctCount++;
        const item = document.createElement("div");
        item.className = "result-item";
        item.onclick = () => openModal(q, userAnswers[i]);
        
        item.innerHTML = `
            <div class="thumb-container"><img src="${q.img}"></div>
            <div class="result-info">
                <span class="tag ${isCorrect ? 'tag-correct' : 'tag-wrong'}">${isCorrect ? '✔ 正確' : '✘ 錯誤'}</span>
                <div class="result-q" style="font-weight:900; margin-bottom:5px; color:var(--nintendo-dark);">${q.q}</div>
                <div style="color:var(--nintendo-green);">解答: ${q.a}</div>
                <div style="color:${isCorrect ? '#333' : 'var(--nintendo-red)'}">選擇: ${userAnswers[i]}</div>
            </div>
        `;
        grid.appendChild(item);
    });
    document.getElementById("scoreText").textContent = `表現: ${Math.round(correctCount/selected.length*100)}% (${correctCount}/${selected.length})`;
}

function openModal(q, userAns) {
    document.getElementById("modalImg").src = q.img;
    document.getElementById("modalQ").textContent = q.q;
    const isCorrect = userAns === q.a;
    document.getElementById("modalA").innerHTML = `
        正確答案：<span style="color:var(--nintendo-green)">${q.a}</span><br>
        你的選擇：<span style="color:${isCorrect ? 'inherit' : 'var(--nintendo-red)'}">${userAns}</span>
    `;
    document.getElementById("modalOverlay").style.display = "flex";
}
	
function closeModal() { document.getElementById("modalOverlay").style.display = "none"; }

	
async function fetchAndCache() {
    const btn = document.getElementById("updateBtn");
    btn.classList.add("loading");
    btn.innerText = "更新中...";

    try {
        const response = await fetch(SPREADSHEET_CSV_URL + '&t=' + Date.now()); // 加時間戳防止瀏覽器快取
        if (!response.ok) throw new Error("網路失敗");
        const csvData = await response.text();
        const parsed = parseCSV(csvData);

        if (parsed.length > 0) {
            questions = parsed;
            localStorage.setItem(CACHE_KEY, JSON.stringify(questions));
            console.log("題庫已更新並儲存");
            return true;
        }
    } catch (e) {
        console.error(e);
        return false;
    } finally {
        btn.classList.remove("loading");
        btn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg> 更新題庫`;
    }
}

/**
 * 手動更新按鈕調用
 */
async function forceUpdate() {
    const success = await fetchAndCache();
    if (success) alert("題庫已更新至最新版本！");
    else alert("更新失敗，請檢查網路連線。");
}

/**
 * 初始化載入（優先讀取暫存）
 */
async function initQuestions() {
    const cached = localStorage.getItem(CACHE_KEY);
    if (cached) {
        questions = JSON.parse(cached);
        console.log("使用暫存題庫開始");
    } else {
        await fetchAndCache();
    }
}
</script>
</body>
</html>
