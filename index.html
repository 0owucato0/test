<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>測驗系統</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    /* 原有樣式保持不變 */
    body { margin: 0; font-family: "Inter", system-ui, sans-serif; background: linear-gradient(180deg, #f6f7f9, #eceff3); }
    .page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
    .quiz-container, .result { width: 100%; max-width: 900px; background: #fff; border-radius: 20px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,.1); }
    .quiz-container img { display: block; margin: 0 auto; max-width: 100%; max-height: 60vh; object-fit: contain; }
    .question { font-size: clamp(1.4rem, 4vw, 1.9rem); font-weight: 600; margin: 20px 0; text-align: center; }
    .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
    .option { padding: 16px; border-radius: 12px; background: #f1f3f8; cursor: pointer; font-size: 1.1rem; border: 2px solid transparent; transition: 0.2s; }
    .option:hover { background: #e8ebf3; }
    .option.selected { background: #4f6ef7; color: #fff; border-color: #3b5bdb; }
    .control { display: flex; gap: 10px; justify-content: flex-end; align-items: center; }
    .timer { background: #2d2f36; color: #fff; padding: 10px 12px; border-radius: 10px; font-weight: 700; min-width: 100px; text-align: center; }
    button { padding: 12px 24px; border-radius: 14px; border: none; cursor: pointer; font-size: 1.05rem; background: #4f6ef7; color: #fff; font-weight: 600; }
    button.secondary { background: #e6e9ef; color: #333; }
    .correct { color: #1f9d55; border-left: 5px solid #1f9d55; padding-left: 10px; }
    .wrong { color: #d64545; border-left: 5px solid #d64545; padding-left: 10px; }
    .unanswered { color: #777; border-left: 5px solid #ccc; padding-left: 10px; }
    .result img { display: none; width: 80%; margin-top: 10px; border-radius: 8px; }
    ul { list-style: none; padding: 0; }
    li { margin-bottom: 20px; padding: 10px; background: #fafafa; border-radius: 8px; }
</style>
</head>

<body>

<div class="page" id="startPage">
    <div class="quiz-container" style="max-width: 400px;">
        <h2 style="text-align:center;">測驗設定</h2>
        <p>⏰秒數：<input id="timeInput" type="number" value="20" min="5" style="padding:6px;width:60px;"></p>
        <p>📚題目數量：<input id="questionCount" type="number" value="10" min="1" style="padding:6px;width:60px;"></p>
        <label><input type="checkbox" id="choiceMode" checked> 作答模式</label>
        <br><br>
        <button style="width:100%" onclick="startQuiz()">開始測試</button>
    </div>
</div>

<div class="page" id="quizPage" style="display:none;">
    <div class="quiz-container">
        <img id="questionImage" src="">
        <div class="question" id="questionText">載入中...</div>
        <div class="options" id="options"></div>
        <div class="control">
            <div class="timer" id="timer"></div>
            <button class="secondary" id="pauseBtn" onclick="togglePause()">暫停</button>
            <button onclick="nextQuestion()">下一題 (Next)</button>
        </div>
    </div>
</div>

<div class="page" id="resultPage" style="display:none;">
    <div class="result">
        <h2>測驗結果</h2>
        <h3 id="scoreText"></h3>
        <button class="secondary" onclick="toggleImages()">顯示 / 隱藏圖片</button>
        <hr>
        <ul id="resultList"></ul>
        <button style="width:100%; margin-top:20px;" onclick="location.reload()">重新測試</button>
    </div>
</div>

<script>
/** * 請在此處填入你的 Google 試算表 CSV 連結 
 */
const SPREADSHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQo7GuN_TnyDh5x_8AQhVhoj6jzTjeCIgMGQSVAhXOG5fhsn7PuBzQDvIAB5fg8NP16DJcvtqp5PFqU/pub?output=csv';

let questions = []; // 全域題庫
let selected = [];  // 本次抽中題目
let index = 0;
let timeLimit = 20;
let timer = null;
let paused = false;
let useChoice = false;
let userAnswers = [];

/**
 * 解析 CSV 資料
 */
function parseCSV(csvText) {
    const lines = csvText.split(/\r?\n/);
    const result = [];
    for (let i = 1; i < lines.length; i++) {
        const columns = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
        if (columns.length >= 3) {
            result.push({
                img: columns[0].replace(/"/g, '').trim(),
                q: columns[1].replace(/"/g, '').trim(),
                a: columns[2].replace(/"/g, '').trim()
            });
        }
    }
    return result;
}

/**
 * 從雲端載入題庫
 */
async function loadCloudQuestions() {
    try {
        const response = await fetch(SPREADSHEET_CSV_URL);
        if (!response.ok) throw new Error("網路請求失敗");
        const csvData = await response.text();
        questions = parseCSV(csvData);
        if (questions.length === 0) alert("題庫是空的，請檢查試算表內容。");
    } catch (error) {
        console.error("載入失敗:", error);
        alert("無法讀取資料，請確認「發佈到網路」已設定為「CSV」格式。");
    }
}

/**
 * 開始測驗
 */
async function startQuiz() {
    if (questions.length === 0) {
        await loadCloudQuestions();
    }
    if (questions.length === 0) return;

    timeLimit = parseInt(document.getElementById("timeInput").value) || 20;
    useChoice = document.getElementById("choiceMode").checked;
    const count = parseInt(document.getElementById("questionCount").value) || 10;

    // 隨機抽選題目
    selected = [...questions].sort(() => 0.5 - Math.random()).slice(0, count);

    index = 0;
    userAnswers = [];
    document.getElementById("startPage").style.display = "none";
    document.getElementById("quizPage").style.display = "flex";

    showQuestion();
}

/**
 * 顯示題目與產生關聯選項
 */
function showQuestion() {
    if (index >= selected.length) return showResult();

    clearInterval(timer);
    paused = false;
    document.getElementById("pauseBtn").textContent = "暫停";

    const q = selected[index];
    document.getElementById("questionImage").src = q.img;
    document.getElementById("questionText").textContent = q.q;
    const optionsEl = document.getElementById("options");
    optionsEl.innerHTML = "";

    if (useChoice) {
        // --- 核心改動：取得相同圖片的答案作為干擾項 ---
        let sameImgPool = questions
            .filter(x => x.img === q.img && x.a !== q.a)
            .map(x => x.a);
        
        // 去重
        sameImgPool = [...new Set(sameImgPool)];

        // 隨機選 3 個
        let wrongs = sameImgPool.sort(() => 0.5 - Math.random()).slice(0, 3);

        // 如果同圖答案不足 3 個，從全域補
        if (wrongs.length < 3) {
            const globalPool = [...new Set(questions.filter(x => x.a !== q.a && !wrongs.includes(x.a)).map(x => x.a))];
            const extra = globalPool.sort(() => 0.5 - Math.random()).slice(0, 3 - wrongs.length);
            wrongs = wrongs.concat(extra);
        }

        // 合併洗牌
        const finalAnswers = [q.a, ...wrongs].sort(() => 0.5 - Math.random());

        finalAnswers.forEach((ans, i) => {
            const div = document.createElement("div");
            div.className = "option";
            div.textContent = `${String.fromCharCode(65 + i)}. ${ans}`;
            div.onclick = () => {
                document.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
                div.classList.add("selected");
                userAnswers[index] = { label: String.fromCharCode(65 + i), value: ans };
            };
            optionsEl.appendChild(div);
        });
    }

    let sec = timeLimit;
    const timerEl = document.getElementById("timer");
    timerEl.textContent = `剩餘 ${sec} 秒`;

    timer = setInterval(() => {
        if (paused) return;
        sec--;
        timerEl.textContent = `剩餘 ${sec} 秒`;
        if (sec <= 0) nextQuestion();
    }, 1000);
}

function togglePause() {
    paused = !paused;
    document.getElementById("pauseBtn").textContent = paused ? "復原" : "暫停";
}

function nextQuestion() {
    clearInterval(timer);
    if (!userAnswers[index]) userAnswers[index] = null;
    index++;
    showQuestion();
}

/**
 * 顯示結果
 */
function showResult() {
    document.getElementById("quizPage").style.display = "none";
    document.getElementById("resultPage").style.display = "flex";

    let correctCount = 0;
    const resultList = document.getElementById("resultList");
    
    resultList.innerHTML = selected.map((q, i) => {
        const ua = userAnswers[i];
        let cls = "unanswered";
        let userDisplay = "未作答";

        if (ua) {
            userDisplay = ua.label + " - " + ua.value;
            if (ua.value === q.a) {
                cls = "correct";
                correctCount++;
            } else {
                cls = "wrong";
            }
        }

        return `
            <li class="${cls}">
                <img src="${q.img}">
                <strong>${q.q}</strong><br>
                正確答案：<span style="color:#1f9d55; font-weight:bold;">${q.a}</span><br>
                ${useChoice ? "你的答案：" + userDisplay : ""}
            </li>`;
    }).join("");

    const percent = Math.round((correctCount / selected.length) * 100);
    document.getElementById("scoreText").textContent = `得分：${percent}% (答對 ${correctCount} / ${selected.length})`;
}

function toggleImages() {
    document.querySelectorAll("#resultList img").forEach(img => {
        img.style.display = (img.style.display === "block") ? "none" : "block";
    });
}
</script>

</body>
</html>
